# Балансировщик перед двумя экземплярами приложения. Состояния в экземпляре нет: токен проверяется по подписи,
# пользователь читается из базы, кэш и лимит входов — в Redis. Поэтому запросы идут по очереди на любой
# экземпляр, без привязки клиента к одному
# Адреса экземпляров спрашиваются у DNS Docker каждые 10 секунд, а не один раз при старте nginx. Иначе
# пересозданный при обновлении контейнер с новым IP не получал бы запросов: nginx стучался бы на старый адрес
resolver 127.0.0.11 valid=10s ipv6=off;

upstream tachkiosk {
    # zone — общая память воркеров: в ней nginx держит адреса, которые обновляет resolve
    zone tachkiosk 64k;
    server app:8080 resolve max_fails=3 fail_timeout=10s;
    server app2:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Протокол клиента. Перед сервером стоит то, что снимает TLS, и присылает X-Forwarded-Proto: https — его и передаём,
# иначе приложение считало бы каждый запрос обычным http. Без такого заголовка — свой протокол
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    # Фото идут прямо в S3 по presigned-ссылке, через приложение — только JSON
    client_max_body_size 1m;

    # Actuator наружу не отдаём: метрики видны по адресам, именам пулов и консьюмеров, частоте ошибок.
    # Prometheus собирает их с app:8080 и app2:8080 напрямую, мимо nginx. health оставлен для внешней проверки
    location = /actuator/health {
        proxy_pass http://tachkiosk;
    }
    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://tachkiosk;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Адрес клиента для лимита входов: приложение верит этому заголовку только от внутренних адресов
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # Экземпляр не ответил — запрос уходит на второй. POST nginx не повторяет: повтор мог бы создать
        # второе объявление, если первый экземпляр успел записать и упал до ответа
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
