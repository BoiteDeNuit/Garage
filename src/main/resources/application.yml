spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/garage
    username: garage
    password: secret
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: 30
