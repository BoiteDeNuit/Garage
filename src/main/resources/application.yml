spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.example.event
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 1s
    web:
        pageable:
          max-page-size: 100
          serialization-mode: via-dto
  cache:
    cache-names: cars
    redis:
      enable-statistics: true
  datasource:
    url: jdbc:postgresql://localhost:5433/garage
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: 30
currency:
  api:
    url: ${CURRENCY_API_URL}
    connect-timeout: 3s
    read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
rate-limit:
  login:
    per-minute: 5
