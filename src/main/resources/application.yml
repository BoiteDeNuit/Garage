spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.example.event
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 1s
    web:
        pageable:
          max-page-size: 100
          serialization-mode: via-dto
  # Число вместо имени ("fuelType": 1) Jackson по умолчанию принимает как номер константы.
  # Тогда порядок в enum стал бы частью API, а новое значение в середине списка тихо меняло бы смысл
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  cache:
    cache-names: listings
    redis:
      enable-statistics: true
  datasource:
    url: jdbc:postgresql://localhost:5433/garage
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Блокировка Flyway в транзакции: CREATE INDEX CONCURRENTLY из V10 ждал бы конца этой транзакции и висел.
    # Без неё Flyway берёт сессионную advisory-блокировку
    postgresql:
      transactional-lock: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: 30
currency:
  api:
    url: ${CURRENCY_API_URL}
    connect-timeout: 3s
    read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
rate-limit:
  login:
    per-minute: 5
# S3-совместимое хранилище фото. Локально LocalStack из compose, в работе AWS S3 или любое совместимое.
# endpoint — адрес для приложения, public-endpoint — для ссылок, которые уходят клиенту
storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:4566}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:4566}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:tachkiosk-photos}
  access-key: ${STORAGE_ACCESS_KEY:test}
  secret-key: ${STORAGE_SECRET_KEY:test}
  upload-ttl: 10m
springdoc:
  default-produces-media-type: application/json
