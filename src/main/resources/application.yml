spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/garage
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  ttl-minutes: 30
currency:
  api:
    url: ${CURRENCY_API_URL}
    connect-timeout: 3s
    read-timeout: 5s
management:
  endpoint:
    health:
      probes:
        enabled: true
